<!DOCTYPE html>
<!-- Tiny Time's app icon. Render: sh scripts/icon.sh  (→ assets/icon.png, 1024²)
     macOS grid: an 824px rounded square centred in 1024, with a soft shadow. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; }
</style></head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34c48d"/>
      <stop offset="1" stop-color="#157a55"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f5ef"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b3d2a" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
  <g filter="url(#soft)">
    <!-- stopwatch crown + side button -->
    <rect x="462" y="212" width="100" height="50" rx="16" fill="#fff"/>
    <rect x="494" y="250" width="36" height="44" fill="#fff"/>
    <rect x="700" y="300" width="56" height="34" rx="12" fill="#fff" transform="rotate(45 728 317)"/>
    <!-- face -->
    <circle cx="512" cy="560" r="252" fill="url(#face)"/>
  </g>
  <!-- tracked slice: a quarter of the hour, in the tile's green -->
  <path d="M512 560 L512 348 A212 212 0 0 1 724 560 Z" fill="#22a676" opacity=".9"/>
  <!-- ticks -->
  <g stroke="#9cc9b5" stroke-width="12" stroke-linecap="round">
    <line x1="512" y1="790" x2="512" y2="760"/>
    <line x1="282" y1="560" x2="312" y2="560"/>
  </g>
  <!-- hand -->
  <line x1="512" y1="560" x2="512" y2="380" stroke="#1d1f22" stroke-width="22" stroke-linecap="round" transform="rotate(90 512 560)"/>
  <circle cx="512" cy="560" r="30" fill="#1d1f22"/>
  <circle cx="512" cy="560" r="11" fill="#fff"/>
</svg>
</body></html>
