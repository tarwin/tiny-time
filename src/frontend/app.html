<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tiny Time</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="brand"><span class="logo"></span>Tiny Time</div>
    <div class="running" id="sideRun"></div>
    <a class="nav" data-view="time"><svg class="ic"><use href="#i-clock"/></svg>Timesheet</a>
    <a class="nav" data-view="reports"><svg class="ic"><use href="#i-chart"/></svg>Reports</a>
    <div class="navsep">Manage</div>
    <a class="nav" data-view="clients"><svg class="ic"><use href="#i-users"/></svg>Clients</a>
    <a class="nav" data-view="projects"><svg class="ic"><use href="#i-folder"/></svg>Projects</a>
    <a class="nav" data-view="tasks"><svg class="ic"><use href="#i-tag"/></svg>Tasks</a>
    <span class="grow"></span>
    <a class="nav" data-view="settings"><svg class="ic"><use href="#i-gear"/></svg>Settings</a>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="tip" id="tip"></div>
<div class="modal-layer" id="modalLayer"></div>
<script type="module" src="app.js"></script>
</body>
</html>
